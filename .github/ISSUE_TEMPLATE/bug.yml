name: Bug report
description: Report a reproducible problem without private data
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "For security issues, use Security → Report a vulnerability. Remove credentials, personal conversations, real callback payloads and unredacted logs before submitting."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: State the expected and observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Give the shortest sequence that triggers the problem. Use synthetic names and data.
      placeholder: "1. Open Lunlet…\n2. Start a local session…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Versions and environment
      description: Lunlet version/build, macOS version, agent/client version and relevant host app.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Safe evidence and scope
      description: Add sanitized screenshots or metadata, and note whether this happens with one session or several.
    validations:
      required: false
