// Refs: US-01, AC-01.02; US-10, AC-10.02, AC-10.04.
// Independent wire declaration, checked against official Node SDK 1.76.0.
syntax = "proto2";
package lunlet.feishu;
option swift_prefix = "FeishuWire";

message Header {
  required string key = 1;
  required string value = 2;
}

message Frame {
  required uint64 seq_id = 1;
  required uint64 log_id = 2;
  required int32 service = 3;
  required int32 method = 4;
  repeated Header headers = 5;
  optional string payload_encoding = 6;
  optional string payload_type = 7;
  optional bytes payload = 8;
  optional string log_id_new = 9;
}
