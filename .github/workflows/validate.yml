# Refs: US-02, AC-02.01, AC-02.05.
name: Validate

# Local preparation only. No automatic publication, signed artifacts or credentials.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Standard runners are free for public repositories. In a private repository only an
    # explicit manual run consumes the account's included macOS minutes; pushes and pull
    # requests stay local until the minute/storage budget is reviewed.
    if: github.event.repository.private == false || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record the toolchain
        id: toolchain
        run: |
          swift --version
          sw_vers
          printf 'swift=%s\n' "$(swift --version 2>&1 | head -n 1 | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"
      # The build directory is restored from the nearest cache for this toolchain and dependency set, so a run
      # rebuilds only what changed; every successful run saves its own entry. Nothing secret lives in .build.
      - name: Restore the Swift build directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: swift-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-${{ hashFiles('Sources/**', 'Tests/**') }}
          restore-keys: |
            swift-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-${{ hashFiles('Package.swift', 'Package.resolved') }}-
            swift-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.swift }}-
      - name: Resolve the pinned dependencies
        run: |
          swift package resolve --disable-keychain
          git diff --exit-code -- Package.resolved
      - name: Verify application modules
        run: scripts/test-core.sh all
      - name: Verify requirements and product-page sources
        run: |
          python3 scripts/test_traceability.py
          python3 scripts/check_traceability.py
          python3 -m unittest discover -s scripts -p test_site.py
          python3 -m unittest discover -s scripts -p test_release.py
          node --check website/app.js
          python3 scripts/build_site.py
          python3 scripts/check_site_assets.py
          git diff --check
